<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mammal Mystery: Coloring sheets</title>
<meta name="robots" content="noindex">
<meta name="description" content="Printable coloring sheets and activity pages for Mammal Mystery, a free game from the SQuEACs Lab.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<!--
  This page is the source of assets/mammal-mystery-coloring-sheets.pdf.
  Open it and print (Letter, no margins, background graphics on) or run
  tools/build_mammal_mystery_pdf.js to rebuild the PDF after changes.
-->
<style>
  @page { size: letter; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ddd; color: #2a2233; font-family: "Fredoka", "Arial Rounded MT Bold", Arial, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 2; background: #2a2233; color: #fff; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .bar button { font: 600 16px "Fredoka", sans-serif; padding: 10px 18px; border-radius: 999px; border: 0; background: #3ddc6f; color: #0b0a10; cursor: pointer; }
  .sheet { width: 8.5in; height: 11in; margin: 16px auto; background: #fff; padding: .55in .6in; position: relative; display: flex; flex-direction: column; align-items: center; overflow: hidden; break-after: page; page-break-after: always; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
  .top { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .top b { font-size: 13px; letter-spacing: .14em; }
  .name { font-size: 16px; }
  .word { width: 100%; height: 1.35in; margin-top: .1in; }
  .word text { font: 700 120px "Fredoka", sans-serif; fill: #fff; stroke: #2a2233; stroke-width: 3.5px; paint-order: stroke; }
  .big { width: 6.6in; height: 6.6in; }
  .big svg { width: 100%; height: 100%; }
  .row { display: flex; gap: .35in; align-items: center; justify-content: center; width: 100%; }
  .hab { width: 2.3in; border: 2.5px solid #2a2233; border-radius: 12px; overflow: hidden; }
  .hab svg { width: 100%; height: auto; display: block; }
  .say { font-size: 17px; text-align: center; max-width: 6.6in; margin: .08in 0 0; line-height: 1.35; }
  h1 { font-size: 34px; margin: .2in 0 .05in; text-align: center; }
  h2 { font-size: 26px; margin: .1in 0 .05in; text-align: center; }
  .tip { font-size: 15px; text-align: center; margin: .05in 0 .15in; color: #4a4255; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .14in; width: 100%; }
  .gcell { border: 2.5px dashed #2a2233; border-radius: 14px; padding: .05in; text-align: center; font-size: 12px; line-height: 1.2; }
  .gcell svg { width: 100%; height: auto; aspect-ratio: 1; }
  .box { width: 22px; height: 22px; border: 2.5px solid #2a2233; border-radius: 6px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .key { display: grid; grid-template-columns: repeat(3, 1fr); gap: .1in .25in; width: 100%; margin-top: .15in; font-size: 18px; }
  .key div { display: flex; align-items: center; gap: 8px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #2a2233; flex: none; }
  .match { display: grid; grid-template-columns: 2.1in 1fr 2.5in; row-gap: .18in; width: 100%; align-items: center; margin-top: .1in; }
  .match .a { width: 1.75in; height: 1.75in; } .match .a svg { width: 100%; height: 100%; }
  .match .h { width: 2.5in; border: 2.5px solid #2a2233; border-radius: 12px; overflow: hidden; } .match .h svg { width: 100%; display: block; }
  .match .d { display: flex; justify-content: space-between; } .match .d i { width: 14px; height: 14px; border-radius: 50%; background: #2a2233; display: block; }
  .teeth { display: grid; grid-template-columns: 2.6in 1fr; gap: .12in .3in; width: 100%; align-items: center; margin-top: .05in; }
  .teeth .t svg { width: 100%; height: auto; }
  .opts { display: flex; gap: .16in; font-size: 18px; flex-wrap: wrap; }
  .opts span { border: 2.5px solid #2a2233; border-radius: 999px; padding: 6px 14px; }
  .lines { width: 100%; }
  .lines div { border-bottom: 2px solid #2a2233; height: .42in; }
  .tree { width: 100%; height: 5.3in; }
  .cut { display: flex; gap: .2in; justify-content: center; margin-top: .1in; }
  .cut div { width: 1.45in; height: 1.45in; border: 2.5px dashed #2a2233; border-radius: 12px; padding: .06in; }
  .cut svg { width: 100%; height: 100%; }
  .key-ans { position: absolute; bottom: .35in; right: .6in; font-size: 11px; transform: rotate(180deg); color: #6a6275; }
  .foot { position: absolute; bottom: .3in; left: 0; right: 0; text-align: center; font-size: 11px; color: #6a6275; }
  @media print { html, body { background: #fff; } .bar { display: none; } .sheet { margin: 0; } }
</style>
<script src="mammal-mystery-art.js?v=7"></script>
<script src="mammal-mystery-data.js?v=3"></script>
</head>
<body>
<div class="bar"><button type="button" onclick="window.print()">Print all sheets</button><span>Letter paper. Each sheet prints on its own page.</span></div>
<div id="sheets"></div>
<script>
(function () {
  const ART = MM_ART, D = MM_DATA, out = [];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const top = (tag) => `<div class="top"><b>MAMMAL MYSTERY · ${tag}</b><span class="name">Name: ______________________</span></div>`;
  const foot = `<div class="foot">Free from the SQuEACs Lab · squeacs.github.io/mammal-mystery.html</div>`;
  // Big hollow letters a child can color.
  const word = (t) => { const fs = t.length > 9 ? 92 : 120; return `<svg class="word" viewBox="0 0 1000 170"><text x="500" y="135" text-anchor="middle" style="font-size:${fs}px">${t}</text></svg>`; };

  // Cover
  out.push(`<section class="sheet">${top("COLORING BOOK")}
    <div style="width:3.2in;margin-top:.15in">${ART.detective(true).replace("<svg ", "<svg style=\"width:100%;height:auto\" ")}</div>
    ${word("Mammal Mystery")}
    <p class="say">Color each animal in your field guide. Grown-ups: read the line under each animal out loud.</p>
    <div class="grid" style="margin-top:.15in;grid-template-columns:repeat(6,1fr);gap:.1in">${D.IDS.map(id => `<div class="gcell">${ART.animal(id, { face: true, line: true })}<span class="box"></span>${cap(D.ANIMALS[id].name)}</div>`).join("")}</div>
    <p class="tip" style="margin-top:.12in">Check the box when you solve that mystery in the game!</p>${foot}</section>`);

  // One page per animal
  D.IDS.forEach(id => {
    const a = D.ANIMALS[id];
    out.push(`<section class="sheet">${top("FIELD GUIDE")}
      ${word(cap(a.name))}
      <div class="big">${ART.animal(id, { line: true })}</div>
      <div class="row"><div class="hab">${ART.habitat(a.scene || a.hab, { line: true })}</div><p class="say" style="text-align:left;max-width:3.6in">${a.facts.pk[0]} ${a.facts.k[0]}<br><span style="font-size:14px">Lives in: ${a.where}</span></p></div>${foot}</section>`);
  });

  // Pre-K and K: color by body part
  const keyColors = [["ears", "pink", "#ff9fc8"], ["eyes", "blue", "#7fb6e8"], ["nose", "black", "#2a2233"], ["tail", "orange", "#ff9f40"], ["paws", "brown", "#8a5a3b"], ["whiskers", "red", "#e8494f"]];
  out.push(`<section class="sheet">${top("PRE-K AND K")}
    <h1>Color by body part</h1><p class="tip">Grown-ups: point to each body part and say its name. Then color it the matching color.</p>
    <div class="big" style="width:6in;height:6in">${ART.animal("fox", { line: true })}</div>
    <div class="key">${keyColors.map(([p, c, hex]) => `<div><span class="dot" style="background:${hex}"></span><b>${cap(p)}</b>&nbsp;= ${c}</div>`).join("")}</div>${foot}</section>`);

  // 1st grade: who lives here?
  const m = ["camel", "polarbear", "otter", "panda"], h = ["river", "desert", "forest", "ice"];
  out.push(`<section class="sheet">${top("1ST GRADE")}
    <h1>Who lives here?</h1><p class="tip">Draw a line from each animal to its home. Then color the pictures.</p>
    <div class="match">${m.map((id, i) => `<div class="a">${ART.animal(id, { line: true })}</div><div class="d"><i></i><i></i></div><div class="h">${ART.habitat(h[i], { line: true })}</div>`).join("")}</div>
    <p class="say">Pick one animal. What body part helps it live in its home?</p><div class="lines" style="max-width:6.6in"><div></div></div>
    <div class="key-ans">Answers: camel = desert, polar bear = ice, otter = river, panda = forest</div>${foot}</section>`);

  // 2nd grade: teeth detective
  const tt = ["lion", "rabbit", "raccoon"];
  out.push(`<section class="sheet">${top("2ND GRADE")}
    <h1>Teeth detective</h1><p class="tip">Look at each set of teeth. Circle what the animal eats. Then draw its food in the box.</p>
    <div class="teeth">${tt.map((id, i) => `<div class="t">${ART.teeth(id, { line: true })}<div style="text-align:center;font-size:15px">Mystery animal ${i + 1}</div></div><div><div class="opts"><span>Carnivore: meat</span><span>Herbivore: plants</span><span>Omnivore: both</span></div><div style="border:2.5px solid #2a2233;border-radius:10px;height:1.2in;margin-top:.12in"></div></div>`).join("")}</div>
    <p class="say" style="margin-top:.2in"><b>Clues:</b> Sharp, pointy teeth slice meat. Flat teeth grind plants. Pointy and bumpy teeth eat both.</p>
    <div class="key-ans">Answers: 1 lion, carnivore · 2 rabbit, herbivore · 3 raccoon, omnivore</div>${foot}</section>`);

  // 2nd grade: family tree cut and paste
  const tips = ["lion", "meerkat", "fox", "giraffe"];
  out.push(`<section class="sheet">${top("2ND GRADE")}
    <h1>Family secrets</h1><p class="tip">Cut out the animals. Glue the two closest cousins on the pink branch. Then fill in the rest.</p>
    <svg class="tree" viewBox="0 0 700 520">
      ${[90, 260, 430, 600].map(x => `<rect x="${x - 70}" y="10" width="140" height="140" rx="16" fill="#fff" stroke="#2a2233" stroke-width="4" stroke-dasharray="12 8"/>`).join("")}
      <path d="M 90 150 V 260 H 260 V 150 M 175 260 V 360 H 430 V 150 M 302 360 V 460 H 600 V 150 M 451 460 V 510" fill="none" stroke="#2a2233" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 90 150 V 260 H 260 V 150" fill="none" stroke="#ff9fc8" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 175 260 V 360 H 430 V 150 M 302 360 V 460 H 600 V 150 M 451 460 V 510" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="188" y="292" font-size="20" fill="#2a2233">Cat branch</text><text x="315" y="392" font-size="20" fill="#2a2233">Carnivorans</text><text x="464" y="492" font-size="20" fill="#2a2233">Mammals</text>
    </svg>
    <div class="cut">${tips.slice().sort().map(id => `<div>${ART.animal(id, { face: true, line: true })}</div>`).join("")}</div>
    <p class="tip">✂ Cut on the dashed lines.</p>
    <div class="key-ans">Answer, left to right: lion and meerkat (cat branch), then fox, then giraffe</div>${foot}</section>`);

  // My own mystery animal
  out.push(`<section class="sheet">${top("ALL GRADES")}
    <h1>Draw your own mystery mammal!</h1><p class="tip">Draw an animal. Give a grown-up three clues. Can they guess it?</p>
    <div style="width:100%;height:5.6in;border:3px solid #2a2233;border-radius:18px"></div>
    <div class="lines" style="margin-top:.2in"><div><span style="font-size:17px;line-height:.6in">Clue 1:</span></div><div><span style="font-size:17px;line-height:.6in">Clue 2:</span></div><div><span style="font-size:17px;line-height:.6in">Clue 3:</span></div></div>${foot}</section>`);

  document.getElementById("sheets").innerHTML = out.join("");
})();
</script>
</body>
</html>
